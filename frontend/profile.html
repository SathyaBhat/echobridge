<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Accounts - EchoBridge</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <script src="config.js"></script>
    <script src="js/common.js?v=2"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html"><span class="brand-mark">E</span><span class="brand-name">EchoBridge</span></a>
            <nav class="nav" aria-label="Main">
                <a href="index.html">Compose</a>
                <a href="history.html">History</a>
                <a href="profile.html" aria-current="page">Accounts</a>
            </nav>
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
        </div>
    </header>

    <main>
        <div class="page-head">
            <div>
                <h1>Accounts</h1>
                <p>Connect the platforms you want to post to.</p>
            </div>
        </div>

        <section class="card">
            <div class="card-title"><h2>Connected</h2></div>
            <div id="accounts-list"><p class="hint">Loading accounts…</p></div>
        </section>

        <section class="card">
            <div class="card-title"><h2>Connect an account</h2></div>

            <div class="provider-tabs" role="tablist" aria-label="Platform">
                <button type="button" role="tab" data-provider="mastodon" aria-selected="true">🦣 Mastodon</button>
                <button type="button" role="tab" data-provider="bluesky" aria-selected="false">🦋 Bluesky</button>
                <button type="button" role="tab" disabled title="Coming soon">Twitter · soon</button>
                <button type="button" role="tab" disabled title="Coming soon">Telegram · soon</button>
                <button type="button" role="tab" disabled title="Coming soon">Discord · soon</button>
            </div>

            <form id="mastodon-form" data-panel="mastodon">
                <label class="field" for="instance-url">
                    <span>Instance URL</span>
                    <input type="text" id="instance-url" name="instance_url" placeholder="mastodon.social" autocomplete="off" required>
                    <small>You'll be redirected to your instance to approve access.</small>
                </label>
                <button type="submit" class="btn">Connect Mastodon</button>
            </form>

            <form id="bluesky-form" data-panel="bluesky" class="hidden">
                <label class="field" for="bluesky-handle">
                    <span>Handle</span>
                    <input type="text" id="bluesky-handle" name="handle" placeholder="you.bsky.social" autocomplete="off" required>
                </label>
                <label class="field" for="bluesky-app-password">
                    <span>App password</span>
                    <input type="password" id="bluesky-app-password" name="app_password" placeholder="xxxx-xxxx-xxxx-xxxx" autocomplete="off" required>
                    <small>Create one at <a href="https://bsky.app/settings/app-passwords" target="_blank" rel="noopener">bsky.app/settings/app-passwords</a></small>
                </label>
                <button type="submit" class="btn">Connect Bluesky</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">EchoBridge · Cross-post to multiple platforms</footer>

    <script src="js/profile.js?v=2"></script>
</body>
</html>
