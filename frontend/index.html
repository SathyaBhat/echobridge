<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Compose - EchoBridge</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="config.js"></script>
    <script src="js/common.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html"><span class="brand-mark">E</span><span class="brand-name">EchoBridge</span></a>
            <nav class="nav" aria-label="Main">
                <a href="index.html" aria-current="page">Compose</a>
                <a href="history.html">History</a>
                <a href="profile.html">Accounts</a>
            </nav>
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
        </div>
    </header>

    <main>
        <div class="page-head">
            <div>
                <h1>Compose</h1>
                <p>Write once, post everywhere. Paste or drop images anywhere on this page.</p>
            </div>
        </div>

        <form id="compose-form">
            <div class="card compose-box" id="compose-box">
                <label for="content" class="sr-only">Message</label>
                <textarea id="content" name="content" placeholder="What's on your mind?"></textarea>
                <div id="media-preview" class="media-preview"></div>

                <div class="compose-footer">
                    <label class="btn btn-ghost btn-sm" for="media" title="Attach images or video">
                        📎 Attach
                    </label>
                    <input type="file" id="media" class="sr-only" multiple accept="image/*,video/*">
                    <button type="button" class="btn btn-ghost btn-sm" id="clear-draft">Clear</button>
                    <div class="char-count" id="char-count" aria-live="polite"></div>
                </div>
            </div>

            <div class="card" style="margin-top: 1rem;">
                <div class="card-title">
                    <h2>Post to</h2>
                    <small id="selected-summary"></small>
                </div>
                <div id="accounts-list" class="chips">
                    <p class="hint">Loading accounts…</p>
                </div>
            </div>

            <div class="card hidden" id="preview-section" style="margin-top: 1rem;">
                <div class="card-title">
                    <h2>Preview</h2>
                    <small>Red text will be rejected by that platform</small>
                </div>
                <div id="preview-list"></div>
            </div>

            <div style="display:flex; align-items:center; gap:0.75rem; margin-top: 1rem; justify-content:flex-end;">
                <span class="hint">Ctrl/⌘ + Enter to post</span>
                <button type="submit" class="btn" id="submit-btn">Post</button>
            </div>
        </form>

        <section class="card hidden" id="results-section" aria-live="polite">
            <div class="card-title">
                <h2>Results</h2>
                <a href="history.html" class="hint">View history</a>
            </div>
            <div id="results-list" class="result-list"></div>
        </section>
    </main>

    <footer class="site-footer">EchoBridge · Cross-post to multiple platforms</footer>

    <script src="js/app.js"></script>
</body>
</html>
